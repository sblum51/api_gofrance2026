# Stockage des médias et des JSON générés par organisation.
#
# En développement : adaptateur local, fichiers hors du webroot (var/storage/…)
# servis par MediaController via une vraie route Symfony, pour que
# NelmioCorsBundle s'applique — tous les serveurs de dev servent directement
# les fichiers réels placés sous public/, en court-circuitant le kernel.
#
# En production : bucket S3 privé `cdn-gofrance`, diffusé par CloudFront sur
# cdn.go-france.net. Les préfixes reproduisent exactement les chemins renvoyés
# par les entités (getLogoUrl() → « /media/logos/… ») : une clé S3
# « media/logos/x.png » devient donc https://cdn.go-france.net/media/logos/x.png
# sans aucune réécriture d'URL. C'est ce qui permet aux deux frontaux de ne
# changer qu'une variable d'environnement.
#
# Les blocs sont dupliqués par environnement plutôt que surchargés : la
# configuration Symfony fusionne les tableaux, et un `directory:` résiduel
# ferait échouer l'adaptateur S3, qui ne connaît pas cette option.

when@dev: &local_storages
    flysystem:
        storages:
            organization_logo.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/var/storage/media/logos'

            organization_cover.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/var/storage/media/covers'

            parcours_photo.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/var/storage/media/parcours'

            parcours_point_media.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/var/storage/media/parcours-points'

            organization_data.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/var/storage/data'

when@test: *local_storages

when@prod:
    flysystem:
        storages:
            organization_logo.storage: &s3
                adapter: 'aws'
                options:
                    client: 'Aws\S3\S3Client'
                    bucket: '%env(AWS_S3_BUCKET)%'
                    prefix: 'media/logos'

            organization_cover.storage:
                <<: *s3
                options:
                    client: 'Aws\S3\S3Client'
                    bucket: '%env(AWS_S3_BUCKET)%'
                    prefix: 'media/covers'

            parcours_photo.storage:
                <<: *s3
                options:
                    client: 'Aws\S3\S3Client'
                    bucket: '%env(AWS_S3_BUCKET)%'
                    prefix: 'media/parcours'

            parcours_point_media.storage:
                <<: *s3
                options:
                    client: 'Aws\S3\S3Client'
                    bucket: '%env(AWS_S3_BUCKET)%'
                    prefix: 'media/parcours-points'

            organization_data.storage:
                <<: *s3
                options:
                    client: 'Aws\S3\S3Client'
                    bucket: '%env(AWS_S3_BUCKET)%'
                    prefix: 'data'
